<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letterpress OBJ Plate Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 480px;
            width: 100%;
            box-sizing: border-box;
        }
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            margin: 25px 0;
            width: 100%;
        }
        .btn {
            border: 2px solid #2563eb;
            color: white;
            background-color: #2563eb;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: block;
            width: 100%;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #1d4ed8;
            border-color: #1d4ed8;
        }
        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .spec-badge {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            text-align: left;
            margin-top: 15px;
        }
        .spec-badge ul {
            margin: 5px 0 0 0;
            padding-left: 20px;
        }
        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #4b5563;
            font-weight: 500;
        }
    </style>

    <!-- Essential Three.js Core + Extensions via CDN -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

<div class="container">
    <h2>Letterpress Plate Generator</h2>
    <p>Select a 2D SVG file to generate a standardized Type-High 3D model.</p>
    
    <div class="upload-btn-wrapper">
        <button class="btn">Select SVG File</button>
        <input type="file" id="svg-file-input" accept=".svg" />
    </div>

    <div id="status">Ready for file...</div>

    <div class="spec-badge">
        <strong>⚙️ Built-in Letterpress Specs (1:1 Metric Output):</strong>
        <ul>
            <li>Artwork Height (Dark): 0.918" (23.317mm)</li>
            <li>Floor/Base Height (Rest): 0.875" (22.225mm)</li>
            <li>Net Relief Depth: 0.043" (1.092mm)</li>
        </ul>
    </div>
</div>

<script>
    const fileInput = document.getElementById('svg-file-input');
    const statusText = document.getElementById('status');

    // Scale constants to map inches natively to millimeter OBJ files
    const INCH_TO_MM = 25.4;
    const BASE_HEIGHT_MM = 0.875 * INCH_TO_MM;  // 22.2250 mm
    const TOTAL_HEIGHT_MM = 0.918 * INCH_TO_MM; // 23.3172 mm
    const RELIEF_DEPTH_MM = TOTAL_HEIGHT_MM - BASE_HEIGHT_MM; // 1.0922 mm

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.name.endsWith('.svg')) {
            statusText.innerText = "Processing vector paths...";
            const reader = new FileReader();
            reader.readAsText(file);
            reader.onload = function(event) {
                try {
                    convertSvgToLetterpressObj(event.target.result, file.name.replace('.svg', '_plate.obj'));
                    statusText.innerText = "Success! Downloading OBJ...";
                } catch (err) {
                    statusText.innerText = "Error processing SVG architecture.";
                    console.error(err);
                }
            };
        } else {
            alert('Please select a file ending in .svg');
            statusText.innerText = "Ready for file...";
        }
    });

    function convertSvgToLetterpressObj(svgText, outputFileName) {
        const loader = new THREE.SVGLoader();
        const svgData = loader.parse(svgText);
        const paths = svgData.paths;
        
        const plateGroup = new THREE.Group();

        // Settings to extrude the dark artwork paths
        const artworkExtrudeSettings = {
            depth: TOTAL_HEIGHT_MM,
            bevelEnabled: false
        };

        // Extract shapes and track boundaries to make a form-fitting base plate
        const allMeshes = [];
        paths.forEach((path) => {
            const shapes = THREE.SVGLoader.createShapes(path);
            shapes.forEach((shape) => {
                const geometry = new THREE.ExtrudeGeometry(shape, artworkExtrudeSettings);
                // Correct Three.js Y-axis inversion relative to SVG standard
                geometry.scale(1, -1, 1); 
                
                const mesh = new THREE.Mesh(geometry);
                plateGroup.add(mesh);
                allMeshes.push(mesh);
            });
        });

        if (allMeshes.length === 0) {
            statusText.innerText = "No paths found in SVG file.";
            return;
        }

        // Calculate the bounding area of all combined shapes to build the perfect backing plate
        const boundingBox = new THREE.Box3().setFromObject(plateGroup);
        const sizeX = boundingBox.max.x - boundingBox.min.x;
        const sizeY = boundingBox.max.y - boundingBox.min.y;
        const centerX = (boundingBox.max.x + boundingBox.min.x) / 2;
        const centerY = (boundingBox.max.y + boundingBox.min.y) / 2;

        // Add a 5mm boundary margin around the artwork so it has room on the plate edge
        const margin = 5; 
        const baseWidth = sizeX + (margin * 2);
        const baseHeight = sizeY + (margin * 2);

        // Create the structural 0.875" plate floor
        const baseGeometry = new THREE.BoxGeometry(baseWidth, baseHeight, BASE_HEIGHT_MM);
        const baseMesh = new THREE.Mesh(baseGeometry);

        // Position base perfectly underneath the layout bounding box
        baseMesh.position.set(centerX, centerY, BASE_HEIGHT_MM / 2);
        plateGroup.add(baseMesh);

        // Shift the artwork meshes forward slightly so they sit on top of the base mesh 
        // and reach up to exactly 0.918" (Total Height)
        allMeshes.forEach(mesh => {
            mesh.position.z = 0; // Sits flat at zero and extrudes all the way up to 0.918"
        });

        // Convert the structural architecture into standard text-based OBJ
        const exporter = new THREE.OBJExporter();
        const objResult = exporter.parse(plateGroup);

        // Trigger safe file dispatch
        downloadFile(objResult, outputFileName);
    }

    function downloadFile(content, fileName) {
        const element = document.createElement('a');
        const file = new Blob([content], {type: 'text/plain'});
        element.href = URL.createObjectURL(file);
        element.download = fileName;
        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);
        // Clear input value so the same file can be uploaded consecutively
        fileInput.value = "";
    }
</script>

</body>
</html>
